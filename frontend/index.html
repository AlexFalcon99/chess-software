<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chess Software</title>
    <style>
        :root {
            --bg: #1c1d22;
            --card-bg: #282a32;
            --accent: #4a77d4;
            --accent-hover: #3862b5;
            --accent-green: #2ecc71;
            --text: #f0f0f0;
            --text-muted: #a0a0b0;
            --border: #3d404d;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 0 0 4px 0;
            color: #f1c40f;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .layout {
            display: flex;
            gap: 32px;
            max-width: 1040px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel-card {
            background: #32353f;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .panel-card h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #5dade2;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 8px 12px;
            background: #1e2026;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }
        button {
            padding: 8px 16px;
            background-color: var(--accent);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background-color: var(--accent-hover); }
        button.btn-green { background-color: var(--accent-green); }
        button.btn-green:hover { background-color: #27ae60; }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .status-item span.value {
            font-weight: bold;
            color: #f1c40f;
        }
        #log-box {
            height: 120px;
            overflow-y: auto;
            background: #18191d;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-line { margin-bottom: 4px; }
        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 64px);
            grid-template-rows: repeat(8, 64px);
            border: 6px solid #4a3828;
            border-radius: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        .square {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background-color: #f0d9b5; color: #222; }
        .square.dark { background-color: #b58863; color: #222; }
        .square.selected { background-color: #7dac43 !important; }
    </style>
</head>
<body>

<h1>Chess Software</h1>
<div class="subtitle">Arquitectura Hexagonal en Sistemas Frontend/Backend - ULPGC</div>

<div class="layout">
    <div class="controls">
        <!-- Caso de uso 1: Crear Sala -->
        <div class="panel-card">
            <h3>1. Crear Sala (Blancas)</h3>
            <div class="input-row">
                <input type="text" id="input-room-name" value="Sala Oficial" placeholder="Nombre de sala">
                <input type="text" id="input-creator-name" value="Alex" placeholder="Jugador 1">
                <button class="btn-green" id="btn-create">Crear</button>
            </div>
        </div>

        <!-- Caso de uso 2: Unirse a Sala -->
        <div class="panel-card">
            <h3>2. Unirse a Sala Compartida (Negras)</h3>
            <div class="input-row">
                <input type="text" id="input-room-id" placeholder="Código o ID de sala">
                <input type="text" id="input-player-name" value="Carlos" placeholder="Jugador 2">
                <button id="btn-join">Unirse</button>
            </div>
        </div>

        <!-- Estado de la partida -->
        <div class="panel-card">
            <h3>Estado de la Partida</h3>
            <div class="status-item"><span>Código de Sala:</span> <span class="value" id="lbl-id">-</span></div>
            <div class="status-item"><span>Blancas:</span> <span class="value
